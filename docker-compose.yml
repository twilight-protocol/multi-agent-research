# 国内云服务器部署：docker compose up -d --build
#
# 单容器形态：Dockerfile 里先用 Node 构建 frontend/dist，再由 FastAPI 用
# StaticFiles 托管，页面与 /api 同源 → 不需要 nginx，SSE 也不会有代理缓冲问题。
services:
  app:
    build: .
    image: ai-knowledge-assistant:latest
    container_name: aka
    # 服务器重启 / 进程崩溃后自动拉起
    restart: unless-stopped
    ports:
      # 左边是服务器对外端口，只暴露这一个；要换端口只改左边
      - "8000:8000"
    # 密钥只放服务器上的 .env（已被 .gitignore 与 .dockerignore 排除，不进镜像）
    env_file:
      - .env
    environment:
      # 容器内固定监听 8000，与上面映射的容器端口保持一致
      - PORT=8000
    volumes:
      # 关键：把运行时数据挂出来，容器重建不会丢
      #   app.db     → 会话与消息
      #   chroma_db  → 向量库（不挂的话每次重启都要重新上传解析 PDF）
      #   uploads    → 上传的原始 PDF
      - ./data:/app/data
    healthcheck:
      # 没用 curl/wget（slim 镜像里没有），直接用 Python 标准库探活
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      # 冷启动要建 Chroma 单例 + 加载依赖，给它 40s 再开始判定失败
      start_period: 40s

services:
  app:
    build: .
    image: multi-agent-research:latest
    container_name: mar
    # 服务器重启 / 进程崩溃后自动拉起
    restart: unless-stopped
    ports:
      # 左边是服务器对外端口（和项目1 的 8000 错开）；要换端口只改左边
      - "8001:8000"
    # 密钥只放服务器上的 .env（已被 .gitignore 与 .dockerignore 排除，不进镜像）
    env_file:
      - .env
    environment:
      # 容器内固定监听 8000，与上面映射的容器端口保持一致
      - PORT=8000
    volumes:
      - ./data:/app/data
    healthcheck:
      # 没用 curl/wget（slim 镜像里没有），直接用 Python 标准库探活
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      # lifespan 里要先建 AsyncSqliteSaver、再编译图，比项目1 的启动稍慢
      start_period: 60s
